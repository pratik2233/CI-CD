name: CD - Deploy NodeJS App to EC2

on:
  workflow_run:
    workflows: ["Build the CI job for nodejs application"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy NodeJS Application to EC2 (Self-Hosted Runner - ap-south-1)
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts from CI workflow
        uses: actions/download-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: ./app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install production dependencies
        working-directory: ./app
        run: npm ci --production

      - name: Stop existing application (if running)
        run: |
          pkill -f "node src/index.js" || true

      - name: Start Node.js Application
        working-directory: ./app
        run: |
          nohup node src/index.js > app.log 2>&1 &
      
      - name: Deployment completed
        run: echo "Deployment completed successfully"
