name: CD - Deploy NodeJS App to EC2 (ap-south-1)

on:
  workflow_run:
    workflows: ["Build the CI job for nodejs application"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to EC2 Self-Hosted Runner
    runs-on: self-hosted

    steps:

      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Update system packages
      - name: Update system packages
        run: sudo apt update -y

      # 3️⃣ Install Node.js & npm (if not installed)
      - name: Install Node.js and npm
        run: sudo apt install -y nodejs npm

      # 4️⃣ Download artifact from CI workflow
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: ./nodejs-app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Install dependencies
      - name: Install project dependencies
        run: |
          cd nodejs-app
          npm install

      # 6️⃣ Start Node.js application
      - name: Start NodeJS application
        run: |
          cd nodejs-app
          nohup npm start > app.log 2>&1 &

      # 7️⃣ Confirmation message
      - name: Deployment completed
        run: echo "Deployment completed successfully 🚀"
